<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YellowBrowse</title>
    <style>
        body {
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRQeJOjbsHdeNSMULj1Djoth1rqLAeNFje7KXonV0gVPA&s=10");
            background-repeat: no-repeat;
            background-size: cover;
        }
        h1 {
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQQmSsiUXlA9HbM_lSgqA4dF_irbyH9rj2X-dg9RDey4A&s=10");
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 90px;
            font-family:"comic sans MS" ;
        }
        .search_bar {
            position:relative;
            right: 2.5vw;
            top: 1vw;
            transform:scale(1.5);
            transform-origin: left top;
            width: fit-content;
            margin: 1vw auto 0;
        }
        h2 { 
            color: black;
            font-family:"comic sans MS" ;
        }
        .yels {
            position:relative;
            top:4vw;
        }
        .yels a {
            text-decoration: none;
        }
    </style>
</head>
<body>
   <h1 style="text-align:center">YELLLOW</h1> 
   <div class="search_bar">
   <form id="search_system">
    <input type="search" id="search_bar" placeholder="Search In YellowBrowse" required />
    <button type="submit">Search</button>
   </form>
   </div>
   <div class="yels">
    <h2 style="text-align:center">Your Yel's</h2>
   <a href="YEL-1.html">
    <button style="border-radius:100%; box-shadow: 0px; background-color:#de0707; position:relative; left:32vw; padding: 0.4vw; ">YEL1</button>
   </a> 

    <a href="YEL-2.html">
    <button style="border-radius:100%; box-shadow: 0px; background-color:#fc5c00; position:relative; left:34vw; padding: 0.4vw; ">YEL2</button>
   </a>

    <a href="YEL-3.html">
    <button style="border-radius:100%; box-shadow: 0px; background-color:#ffff00; position:relative; left:36vw; padding: 0.4vw; ">YEL3</button>
   </a> 

    <a href="YEL-4.html">
    <button style="border-radius:100%; box-shadow: 0px; background-color:#6fe607; position:relative; left:38vw; padding: 0.4vw; ">YEL4</button>
   </a> 

    <a href="YEL-5.html">
    <button style="border-radius:100%; box-shadow: 0px; background-color:#2a97d1; position:relative; left:40vw; padding: 0.4vw; ">YEL5</button>
   </a> 

    <a href="YEL-6.html">
    <button style="border-radius:100%; box-shadow: 0px; background-color:#00166f; color:white; position:relative; left:42vw; padding: 0.4vw; ">YEL6</button>
   </a> 

    <a href="YEL-7.html">
    <button style="border-radius:100%; box-shadow: 0px; background-color:#480991; position:relative; left:44vw; padding: 0.4vw; ">YEL7</button>
   </a> 
   </div>
   <script>
   const form = document.getElementById("search_system");
  const input = document.getElementById("search_bar");

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const query = encodeURIComponent(input.value.trim());
    if (!query) return;

    const url = `https://www.google.com/search?q=${query}`;
    window.open(url, "_blank", "noopener,noreferrer");
  });
</script>
</body>
</html>
